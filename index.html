<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PluzBot Inspecciones</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1B3A6B 0%, #0F2347 100%);
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 16px;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h2 { margin: 0 0 10px 0; font-size: 24px; font-weight: 700; }
        p { color: #d0d7de; font-size: 15px; line-height: 1.5; margin: 0 0 24px 0; }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn {
            display: inline-block;
            background: #ffffff;
            color: #1B3A6B;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn:hover { background: #f0f4f8; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h2>Conectando con PluzBot...</h2>
        <p>Iniciando entorno corporativo de IA y base de datos de costos.</p>
        <a id="btn-manual" class="btn" href="#">Abrir PluzBot</a>
    </div>

    <script>
        const TARGET_URL = "https://general-fleet-foam-netscape.trycloudflare.com";
        document.getElementById("btn-manual").href = TARGET_URL;
        setTimeout(() => {
            window.location.replace(TARGET_URL);
        }, 500);
    </script>
</body>
</html>
